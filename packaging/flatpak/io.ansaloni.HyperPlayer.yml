# The player as a Flatpak (packaging/flatpak/build.sh). Built from this checkout;
# Cargo fetches crates during the build (fine for our own bundles, not for Flathub).
# With its library engine (the server's code, Node.js, sharp and ffmpeg), which build.sh
# stages into release/flatpak/engine first.
id: io.ansaloni.HyperPlayer
runtime: org.freedesktop.Platform
runtime-version: "26.08"
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: hyperplayer
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  # X11 too, not just as a fallback: Slint's clipboard (arboard) needs a Wayland
  # data-control protocol that GNOME lacks, and otherwise uses X11 through XWayland.
  - --socket=x11
  - --device=dri
  # Audio (ALSA in the sandbox goes through PulseAudio/PipeWire).
  - --socket=pulseaudio
  # The device token is kept in the desktop's keyring (Secret Service).
  - --talk-name=org.freedesktop.secrets
  # Media keys and the desktop's player controls (MPRIS).
  - --own-name=org.mpris.MediaPlayer2.hyperplayer
  # The music on this computer, for the library engine: read only, wherever it usually is
  # (folders elsewhere are chosen through the folder dialog's portal).
  - --filesystem=home:ro
  - --filesystem=/mnt:ro
  - --filesystem=/media:ro
  - --filesystem=/run/media:ro
modules:
  # The player looks for it in ../lib/hyperplayer/server, next to /app/bin.
  - name: engine
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/hyperplayer
      - cp -a . /app/lib/hyperplayer/server
    sources:
      - type: dir
        path: ../../release/flatpak/engine

  - name: hyperplayer
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin
      build-args:
        - --share=network
      env:
        CARGO_HOME: /run/build/hyperplayer/cargo-home
    build-commands:
      - cargo build --release --locked -p hyperplayer
      - install -Dm755 target/release/hyperplayer /app/bin/hyperplayer
      - install -Dm644 packaging/linux/io.ansaloni.HyperPlayer.desktop /app/share/applications/io.ansaloni.HyperPlayer.desktop
      - install -Dm644 packaging/flatpak/io.ansaloni.HyperPlayer.metainfo.xml /app/share/metainfo/io.ansaloni.HyperPlayer.metainfo.xml
      - install -Dm644 apps/client/icons/hyperplayer.svg /app/share/icons/hicolor/scalable/apps/io.ansaloni.HyperPlayer.svg
      - for size in 16 32 48 64 128 256 512; do install -Dm644 apps/client/icons/hyperplayer-$size.png /app/share/icons/hicolor/${size}x${size}/apps/io.ansaloni.HyperPlayer.png; done
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - target
          - release
          - node_modules
          - apps/client/node_modules
          - apps/server/node_modules
          - apps/server/dist
          - apps/server/.data
          - packages/schemas/node_modules
