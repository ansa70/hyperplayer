# Checks every push to main and every pull request: the same checks as `vp run ready`
# (format, lint, type check, tests, clippy), plus clippy on the Windows-only code.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2.9.3

      # The player's native libraries (audio, devices, fonts).
      - name: Install system libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libfontconfig-dev

      - run: vp check
      - run: vp run -r test
      - run: vp run @hyperplayer/client#lint

  windows:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: windows

      - uses: taiki-e/install-action@v2.87.31
        with:
          tool: cargo-xwin

      - name: Install cross-compiling tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang lld llvm

      - run: vp run @hyperplayer/schemas#generate
      - run: cargo xwin clippy --target x86_64-pc-windows-msvc -p hyperplayer -p hyperplayer-service -- -D warnings
