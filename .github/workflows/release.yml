# Builds the release downloads with the scripts in packaging/: the Linux bundle (with the
# player's .deb and Flatpak) and the Windows installer.
#
# Pushing a tag v<version> (the version in apps/client/Cargo.toml, e.g. v0.1.0-beta.3)
# creates a draft GitHub release with them, to review and publish by hand. Run by hand
# (Actions → Release → Run workflow), it only builds them, as the run's artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: version
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' apps/client/Cargo.toml | head -1)
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the version in apps/client/Cargo.toml ($VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >>"$GITHUB_OUTPUT"

  linux:
    needs: version
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.3

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libfontconfig-dev dpkg-dev fakeroot flatpak flatpak-builder

      # Flathub's SDK for the Flatpak (built with Ubuntu's flatpak-builder: Flathub's own
      # doesn't find the SDK here). The build sandbox needs unprivileged user
      # namespaces, which Ubuntu restricts by default.
      - name: Set up Flatpak
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08 \
            org.freedesktop.Sdk.Extension.rust-stable//26.08

      - run: packaging/linux/build-release.sh

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: linux
          path: |
            release/hyperplayer-${{ needs.version.outputs.version }}-linux-x64.tar.gz
            release/hyperplayer-${{ needs.version.outputs.version }}-x86_64.flatpak
          if-no-files-found: error

  windows:
    needs: version
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2.9.3
        with:
          key: windows

      - uses: taiki-e/install-action@v2.87.31
        with:
          tool: cargo-xwin

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang lld llvm nsis unzip

      - run: packaging/windows/build.sh

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: windows
          path: release/hyperplayer-${{ needs.version.outputs.version }}-windows-x64-setup.exe
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [version, linux, windows]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd dist
          sha256sum -- * >SHA256SUMS
          # A version with a suffix (-beta.2, -rc.1) is a pre-release.
          FLAGS=()
          [[ "$VERSION" == *-* ]] && FLAGS+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            "${FLAGS[@]}" --title "HyperPlayer $VERSION" --generate-notes -- *
