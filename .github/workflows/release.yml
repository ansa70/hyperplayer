# Builds the release downloads with the scripts in packaging/: the Linux bundle (with the
# player's .deb and Flatpak), the Windows installer and the macOS disk images (Apple
# Silicon and Intel, each built on its own kind of Mac).
#
# Pushing a tag v<version> (the version in apps/client/Cargo.toml, e.g. v0.1.1)
# creates a draft GitHub release with them, to review and publish by hand. Run by hand
# (Actions → Release → Run workflow), it only builds them, as the run's artifacts.
#
# Windows files are signed through SignPath Foundation once the repository variable
# SIGNPATH_ORGANIZATION_ID and the secret SIGNPATH_API_TOKEN are set: our programs first,
# then the installer built from them (artifact configurations in packaging/windows/signpath).
# A tag uses the release-signing policy, which waits for an approval in SignPath for
# each request; a run by hand uses test-signing (a test certificate, no approval).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
      - id: version
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' apps/client/Cargo.toml | head -1)
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the version in apps/client/Cargo.toml ($VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >>"$GITHUB_OUTPUT"

  linux:
    needs: version
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.3

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev libfontconfig-dev dpkg-dev fakeroot flatpak flatpak-builder

      # Flathub's SDK for the Flatpak (built with Ubuntu's flatpak-builder: Flathub's own
      # doesn't find the SDK here). The build sandbox needs unprivileged user
      # namespaces, which Ubuntu restricts by default.
      - name: Set up Flatpak
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub \
            org.freedesktop.Platform//26.08 org.freedesktop.Sdk//26.08 \
            org.freedesktop.Sdk.Extension.rust-stable//26.08

      - run: packaging/linux/build-release.sh

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-linux
          path: |
            release/hyperplayer-${{ needs.version.outputs.version }}-linux-x64.tar.gz
            release/hyperplayer-${{ needs.version.outputs.version }}-x86_64.flatpak
          if-no-files-found: error

  windows:
    needs: version
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      # SignPath's action downloads the artifacts it signs.
      actions: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
      SIGN: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
      SIGNING_POLICY: ${{ github.ref_type == 'tag' && 'release-signing' || 'test-signing' }}
    steps:
      - uses: actions/checkout@v7.0.1

      # Builds that get signed start from nothing cached.
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: ${{ github.ref_type != 'tag' }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - if: github.ref_type != 'tag'
        uses: Swatinem/rust-cache@v2.9.3
        with:
          key: windows

      - uses: taiki-e/install-action@v2.87.31
        with:
          tool: cargo-xwin

      - name: Install system packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends clang lld llvm nsis unzip

      - run: packaging/windows/build.sh stage

      - name: Upload the programs to sign
        id: programs
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: windows-programs-unsigned
          path: |
            release/windows/hyperplayer.exe
            release/windows/uninstall.exe
            release/windows/server/hyperplayer-service.exe
          if-no-files-found: error

      - name: Sign the programs
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: hyperplayer
          signing-policy-slug: ${{ env.SIGNING_POLICY }}
          artifact-configuration-slug: programs
          github-artifact-id: ${{ steps.programs.outputs.artifact-id }}
          parameters: |
            version: "${{ env.VERSION }}"
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: release/signed-programs

      - name: Use the signed programs
        if: env.SIGN == 'true'
        run: cp -r release/signed-programs/. release/windows/

      - run: packaging/windows/build.sh installer

      - name: Upload the installer to sign
        id: installer
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          path: release/hyperplayer-${{ env.VERSION }}-windows-x64-setup.exe
          archive: false
          if-no-files-found: error

      - name: Sign the installer
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: hyperplayer
          signing-policy-slug: ${{ env.SIGNING_POLICY }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.installer.outputs.artifact-id }}
          parameters: |
            version: "${{ env.VERSION }}"
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: release/signed-installer
          skip-decompress: true

      - name: Use the signed installer
        if: env.SIGN == 'true'
        run: mv release/signed-installer/hyperplayer-"$VERSION"-windows-x64-setup.exe release/

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-windows
          path: release/hyperplayer-${{ env.VERSION }}-windows-x64-setup.exe
          if-no-files-found: error

  macos:
    needs: version
    strategy:
      matrix:
        include:
          - runner: macos-26
            arch: arm64
          - runner: macos-26-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "24"
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2.9.3

      - run: packaging/macos/build.sh

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-macos-${{ matrix.arch }}
          path: release/hyperplayer-${{ needs.version.outputs.version }}-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [version, linux, windows, macos]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      # The downloads only, not the unsigned files sent for signing.
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          SIGNED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
        run: |
          cd dist
          sha256sum -- * >SHA256SUMS
          # 0.x (still in beta) or a version with a suffix (-rc.1) is a pre-release.
          FLAGS=()
          [[ "$VERSION" == 0.* || "$VERSION" == *-* ]] && FLAGS+=(--prerelease)
          # SignPath Foundation asks for its code signing policy on the download page.
          NOTES=
          [[ "$SIGNED" == true ]] &&
            NOTES="The Windows files are signed: see the [code signing policy](https://github.com/$GITHUB_REPOSITORY#code-signing-policy)."
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            "${FLAGS[@]}" --title "HyperPlayer $VERSION" --notes "$NOTES" --generate-notes -- *
