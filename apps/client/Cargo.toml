[package]
name = "hyperplayer"
version = "0.1.0"
edition = "2024"
description = "Native HyperPlayer client"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
rtrb = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
rodio = { version = "0.23", default-features = false, features = [
  "playback",
  "flac",
  "mp3",
  "mp4",
  "vorbis",
  "wav",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regress = "0.10"
slint = "1.18"

[build-dependencies]
prettyplease = "0.2"
schemars = "0.8"
serde_json = "1"
slint-build = "1.18"
syn = "2"
typify = "0.8"
