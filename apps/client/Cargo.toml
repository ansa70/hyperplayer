[package]
name = "hyperplayer"
version = "0.1.0-beta.2"
edition = "2024"
description = "Native HyperPlayer client"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
keyring = "4.2"
rtrb = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
# The same rustls as reqwest's, for its certificate check (trusting self-signed servers).
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
rustls-platform-verifier = "0.7"
sha2 = "0.11"
rodio = { version = "0.23", default-features = false, features = [
  "playback",
  "flac",
  "mp3",
  "mp4",
  "vorbis",
  "wav",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regress = "0.10"
souvlaki = { version = "0.8", default-features = false, features = ["use_zbus"] }
slint = { version = "1.18", features = ["unstable-winit-030"] }

[target.'cfg(target_os = "linux")'.dependencies]
# The desktop's settings portal (the window-button layout), as the media controls already use it.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3"
prettyplease = "0.2"
schemars = "0.8"
serde_json = "1"
slint-build = "1.18"
syn = "2"
typify = "0.8"
